name: CI

# 1. TRIGGERS: Run on direct pushes/merges to main AND on every pull request
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # JOB 1: Fastest check runs first
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: make lint

  # JOB 2: Waits for 'lint' to pass before starting
  test:
    name: test
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: make test

  # JOB 3: Waits for 'test' to pass, builds the .tgz, and saves it
  package:
    name: package
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: '*.tgz'
          if-no-files-found: error